[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-topaz-lispex"
version = "0.1.0"
description = "Pygments lexers for STUDIO HAZE's Topaz and Lispex languages"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-2-Clause"}
authors = [{name = "STUDIO HAZE"}]
dependencies = ["Pygments>=2.18"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pygments",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Filters",
]

[project.urls]
Repository = "https://github.com/studiohaze/pygments-topaz-lispex"
Topaz = "https://topaz.ooo/"
Lispex = "https://www.lispex.com/"

[project.entry-points."pygments.lexers"]
studiohaze_topaz = "pygments_studiohaze:TopazLexer"
studiohaze_lispex = "pygments_studiohaze:LispexLexer"

[tool.setuptools.packages.find]
where = ["src"]
